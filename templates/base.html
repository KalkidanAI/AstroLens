<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AstroLens - AI Powered Astronomical Observatory Platform">
    <title>{% block title %}AstroLens — AI Observatory Platform{% endblock %}</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Consolas', 'monospace']
                    },
                    colors: {
                        sky: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7'
                        },
                        dark: {
                            bg: '#000000',
                            surface: '#0a0a0a',
                            card: '#111111',
                            border: '#222222'
                        }
                    }
                }
            }
        };
    </script>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Custom Style Fallbacks -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-black text-neutral-100 font-sans antialiased selection:bg-sky-500 selection:text-black">
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
    
    <div class="flex min-h-screen">
        <!-- TAILWIND SIDEBAR -->
        <aside class="w-64 bg-neutral-950 border-r border-neutral-800/80 flex flex-col fixed inset-y-0 left-0 z-40 transition-transform duration-300 md:translate-x-0 -translate-x-full" id="sidebar">
            <!-- Brand Header -->
            <div class="p-5 border-b border-neutral-800/80 flex flex-col">
                <a href="/" class="flex items-center gap-2.5 font-extrabold text-xl tracking-tight text-white group">
                    <div class="w-7 h-7 rounded-md bg-gradient-to-tr from-sky-500 to-sky-400 flex items-center justify-center text-black font-black text-xs shadow-lg shadow-sky-500/20 group-hover:scale-105 transition-transform">
                        AL
                    </div>
                    <span>ASTRO<span class="text-sky-400">LENS</span></span>
                </a>
                <span class="text-[10px] text-neutral-400 font-semibold tracking-wider uppercase mt-1">AI Observatory Platform</span>
            </div>

            <!-- User Profile Container -->
            <div class="p-3 mx-3 my-3 bg-neutral-900/60 rounded-xl border border-neutral-800/80 flex items-center gap-3" id="sidebar-user-container">
                <div class="w-8 h-8 rounded-full bg-neutral-800 border border-sky-400/40 text-sky-400 font-bold text-xs flex items-center justify-center shrink-0" id="sidebar-user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-xs font-semibold text-white truncate" id="sidebar-username-text">Observer</div>
                    <span class="text-[10px] text-neutral-400 block truncate">Active Session</span>
                </div>
                <button onclick="AstroLens.logout()" class="text-neutral-400 hover:text-red-400 text-xs p-1.5 transition-colors" title="Logout">
                    <i class="fas fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 space-y-1 py-2 overflow-y-auto" id="sidebar-nav-list">
                <a href="/dashboard" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-neutral-400 hover:text-white hover:bg-neutral-900 transition-all group" data-page="dashboard">
                    <i class="fas fa-chart-line text-neutral-400 group-hover:text-sky-400 transition-colors w-4"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/observatory" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-neutral-400 hover:text-white hover:bg-neutral-900 transition-all group" data-page="observatory" data-role="admin">
                    <i class="fas fa-telescope text-neutral-400 group-hover:text-sky-400 transition-colors w-4"></i>
                    <span>Observatory</span>
                </a>
                <a href="/sky" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-neutral-400 hover:text-white hover:bg-neutral-900 transition-all group" data-page="sky">
                    <i class="fas fa-globe text-neutral-400 group-hover:text-sky-400 transition-colors w-4"></i>
                    <span>Sky Map</span>
                </a>
                <a href="/settings" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-neutral-400 hover:text-white hover:bg-neutral-900 transition-all group" data-page="settings" data-role="admin">
                    <i class="fas fa-gear text-neutral-400 group-hover:text-sky-400 transition-colors w-4"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- Status Footer -->
            <div class="p-4 border-t border-neutral-800/80 bg-neutral-950/80 space-y-2 text-[11px] text-neutral-400">
                <div class="flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="telescope-status-dot"></span>
                        <span>Telescope Mount</span>
                    </span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500" id="ai-status-dot"></span>
                        <span>YOLOv8 Engine</span>
                    </span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500" id="stellarium-status-dot"></span>
                        <span>Stellarium API</span>
                    </span>
                </div>
                <div class="pt-2 border-t border-neutral-900 flex justify-between font-mono text-[10px] text-neutral-500">
                    <span id="current-time">--:--:--</span>
                    <span id="current-date">--/--/----</span>
                </div>
            </div>
        </aside>

        <!-- Mobile Menu Toggle Button -->
        <button class="md:hidden fixed top-4 left-4 z-50 p-2.5 bg-neutral-900 border border-neutral-800 rounded-lg text-white text-sm" id="menu-toggle" aria-label="Toggle Menu">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Main Workspace Area -->
        <main class="flex-1 md:ml-64 p-6 md:p-8 bg-black min-h-screen">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var currentPath = window.location.pathname;
            var isAdmin = AstroLens.isAdmin();
            
            // Protect Admin-only pages
            var adminPages = ['/observatory', '/settings'];
            if (!isAdmin && adminPages.includes(currentPath)) {
                AstroLens.showToast('Access denied. Admins only.', 'error');
                setTimeout(function() { window.location.href = '/dashboard'; }, 1000);
                return;
            }

            var navItems = document.querySelectorAll('#sidebar-nav-list .nav-item');
            navItems.forEach(function (item) {
                // Hide admin-only links for non-admins
                if (item.getAttribute('data-role') === 'admin' && !isAdmin) {
                    item.style.display = 'none';
                }
                
                var href = item.getAttribute('href');
                if (currentPath === href || (href !== '/' && currentPath.startsWith(href))) {
                    item.classList.add('bg-neutral-900', 'text-white', 'border-l-2', 'border-sky-400');
                    item.classList.remove('text-neutral-400');
                    var icon = item.querySelector('i');
                    if (icon) icon.classList.add('text-sky-400');
                }
            });

            var user = AstroLens.getUser();
            if (user) {
                var nameEl = document.getElementById('sidebar-username-text');
                var avatarEl = document.getElementById('sidebar-user-avatar');
                if (nameEl) nameEl.textContent = user.username || 'Observer';
                if (avatarEl && user.username) {
                    avatarEl.textContent = user.username.charAt(0).toUpperCase();
                }
            }

            var toggle = document.getElementById('menu-toggle');
            var sidebar = document.getElementById('sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', function() {
                    sidebar.classList.toggle('-translate-x-full');
                });
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
